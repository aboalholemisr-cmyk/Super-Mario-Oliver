name: Build Super Jump Adventure APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SuperJumpAdventure_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - run: |
          unzip -q SuperJumpAdventure_Android_Project.zip -d source
          gradle -p source/SuperJumpAdventure_Android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SuperJumpAdventure-APK
          path: source/SuperJumpAdventure_Android/app/build/outputs/apk/debug/app-debug.apk
